# Privacy Indicator - migrated from the legacy v4 plugin (Noctalia Team).
# Detects microphone, camera and screen-sharing capture and keeps an access
# history. A headless [[service]] polls `pw-dump` for the PipeWire graph and
# scans open /dev/video* devices; the bar widget and history panel are thin
# clients reading its published state.

id = "simply-sharat/privacy_indicator"
name = "Privacy Indicator"
version = "1.0.0"
plugin_api = 24
author = "simply-sharat"
license = "MIT"
dependencies = ["pw-dump"]
tags = ["bar", "privacy", "indicator"]
icon = "shield-check"
description = "Shows when microphone, camera or screen sharing is active, with an access history panel."

[[setting]]
key = "enable_toast"
type = "bool"
label_key = "settings.enable_toast.label"
description_key = "settings.enable_toast.description"
default = true

[[setting]]
key = "mic_filter_regex"
type = "string"
label_key = "settings.mic_filter.label"
description_key = "settings.mic_filter.description"
default = "effect_input.rnnoise|easyeffects"

[[setting]]
key = "cam_filter_regex"
type = "string"
label_key = "settings.cam_filter.label"
description_key = "settings.cam_filter.description"
default = "droidcam"

[[widget]]
id = "bar"
entry = "widget.luau"

[[widget.setting]]
key = "hide_inactive"
type = "bool"
label_key = "settings.hide_inactive.label"
description_key = "settings.hide_inactive.description"
default = false

[[widget.setting]]
key = "icon_spacing"
type = "int"
label_key = "settings.icon_spacing.label"
description_key = "settings.icon_spacing.description"
min = 0
max = 48
default = 4

[[widget.setting]]
key = "active_color"
type = "select"
label_key = "settings.active_color.label"
description_key = "settings.active_color.description"
default = "primary"
options = [
  { value = "primary", label_key = "settings.color.primary" },
  { value = "secondary", label_key = "settings.color.secondary" },
  { value = "tertiary", label_key = "settings.color.tertiary" },
  { value = "error", label_key = "settings.color.error" },
  { value = "on_surface", label_key = "settings.color.on_surface" },
]

[[widget.setting]]
key = "inactive_color"
type = "select"
label_key = "settings.inactive_color.label"
description_key = "settings.inactive_color.description"
default = "none"
options = [
  { value = "none", label_key = "settings.color.none" },
  { value = "primary", label_key = "settings.color.primary" },
  { value = "secondary", label_key = "settings.color.secondary" },
  { value = "tertiary", label_key = "settings.color.tertiary" },
  { value = "error", label_key = "settings.color.error" },
  { value = "on_surface", label_key = "settings.color.on_surface" },
  { value = "outline", label_key = "settings.color.outline" },
  { value = "surface_variant", label_key = "settings.color.surface_variant" },
]

[[panel]]
id = "panel"
entry = "panel.luau"
width = 360
height = 480
placement = "attached"
position = "auto"

[[service]]
id = "service"
entry = "service.luau"
