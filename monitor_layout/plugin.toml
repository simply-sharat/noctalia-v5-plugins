# Monitor Layout - migrated from the legacy v4 plugin (Mathew-D).
# Arrange multiple displays and change their resolutions from a Noctalia
# panel. A headless [[service]] reads output state from Sway or Hyprland,
# owns the draft/live layout, and applies it; the bar widget and
# control-center shortcut are thin clients.

id = "simply-sharat/monitor_layout"
name = "Monitor Layout"
version = "1.0.0"
plugin_api = 24
author = "simply-sharat"
license = "MIT"
dependencies = ["swaymsg or hyprctl"]
tags = ["display", "system", "utility"]
icon = "device-desktop"
description = "Arrange multiple displays and change their resolutions from a Noctalia panel."

[[setting]]
key = "backend"
type = "select"
label_key = "settings.backend.label"
description_key = "settings.backend.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.backend.auto" },
  { value = "sway", label_key = "settings.backend.sway" },
  { value = "hyprland", label_key = "settings.backend.hyprland" },
]

[[setting]]
key = "sway_command"
type = "string"
label_key = "settings.sway_command.label"
description_key = "settings.sway_command.description"
default = "swaymsg"

[[setting]]
key = "hyprctl_command"
type = "string"
label_key = "settings.hyprctl_command.label"
description_key = "settings.hyprctl_command.description"
default = "hyprctl"

[[setting]]
key = "snap_to_grid"
type = "bool"
label_key = "settings.snap_to_grid.label"
description_key = "settings.snap_to_grid.description"
default = true

[[setting]]
key = "grid_size"
type = "int"
label_key = "settings.grid_size.label"
description_key = "settings.grid_size.description"
min = 8
max = 200
default = 40

[[setting]]
key = "icon_color"
type = "color"
label_key = "settings.icon_color.label"
description_key = "settings.icon_color.description"
default = "primary"

[[widget]]
id = "bar"
entry = "widget.luau"

[[shortcut]]
id = "shortcut"
entry = "shortcut.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 780
height = 620
placement = "floating"
position = "center"
open_near_click = true

[[service]]
id = "service"
entry = "service.luau"
